name: Build Motor Pitch RPM APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mcoder/ESP32_AS5047P/android/MotorPitchRpm/**"
      - ".github/workflows/motor-pitch-rpm.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcoder/ESP32_AS5047P/android/MotorPitchRpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotorPitchRpm-debug
          path: mcoder/ESP32_AS5047P/android/MotorPitchRpm/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
